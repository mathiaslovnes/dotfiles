
# General settings
# all, not on: Claude's notification hook passes kitty's notification through from windows that aren't showing
set -g allow-passthrough all
# vim for copy-mode
# setw -g mode-keys vi
set-window-option -g mode-keys vi
# to prevent lag in neovim because of vi-mode
set -sg escape-time 10
set -g mouse on
set -g renumber-window on
set -g history-limit 50000  # scrollback per pane (default 2000); applies to panes created afterwards
set -g copy-mode-line-numbers relative  # Vim-style relative line numbers in copy mode, for 5j / 12k

set -g update-environment "DISPLAY"
# Programs inside tmux see tmux's own terminal type: with xterm-kitty, Neovim read tmux's Home/End as <Find>/<Select>
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB"
# Pass keys like Shift+Enter and Ctrl+Enter through as their own keys instead of plain Enter
# (Claude Code: Shift+Enter = newline). Only programs that ask for these keys get them.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# Forward OSC 8 hyperlinks to kitty (tmux doesn't detect kitty's support on its own)
set -as terminal-features ',xterm-kitty:hyperlinks'

# Set tmux prefix to Ctrl-w (instead of C-b)
set-option -g prefix C-w
unbind-key C-b          # unbind old prefix
bind-key C-w send-prefix

unbind [
unbind v
unbind-key v
unbind C-v
unbind -n C-v
unbind-key C-v
unbind-key c # Unbind create new pane
unbind C-c
unbind-key C-c
bind-key C-c copy-mode
unbind-key d # Unbind terminating session/server

# Setup 'v' to begin selection, just like Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Setup 'y' to yank (copy), just like Vim
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Update the default binding of 'Enter' to use copy-selection-and-cancel
unbind-key -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel


# Pane switching: Karabiner turns Ctrl+H/J/K/L into arrows, so Ctrl-w Ctrl-h arrives here as prefix Left.
# A pane Neovim has marked (@pane-is-vim, set by smart-splits' tmux backend) gets Ctrl+h/j/k/l, which smart-splits
# moves on (into the next tmux pane at Neovim's edge); other panes switch here, stopping at the window's edge.
bind-key Left  if -F '#{@pane-is-vim}' 'send-keys C-h' "if -F '#{pane_at_left}'   '' 'select-pane -L'"
bind-key Down  if -F '#{@pane-is-vim}' 'send-keys C-j' "if -F '#{pane_at_bottom}' '' 'select-pane -D'"
bind-key Up    if -F '#{@pane-is-vim}' 'send-keys C-k' "if -F '#{pane_at_top}'    '' 'select-pane -U'"
bind-key Right if -F '#{@pane-is-vim}' 'send-keys C-l' "if -F '#{pane_at_right}'  '' 'select-pane -R'"
# prefix j/k/l the same (prefix h splits, below)
bind-key j if -F '#{@pane-is-vim}' 'send-keys C-j' "if -F '#{pane_at_bottom}' '' 'select-pane -D'"
bind-key k if -F '#{@pane-is-vim}' 'send-keys C-k' "if -F '#{pane_at_top}'    '' 'select-pane -U'"
bind-key l if -F '#{@pane-is-vim}' 'send-keys C-l' "if -F '#{pane_at_right}'  '' 'select-pane -R'"

# == Pane Resizing ===
# smart-splits' tmux backend (plugin below) binds Ctrl/Alt+hjkl; they reach Neovim when it has marked the pane (@pane-is-vim)
set -g @smart-splits_at_edge 'stop'  # same as move.at_edge in Neovim's smart-splits.lua
# Optional configurations with their default values if omitted:

# set -g @smart-splits_move_left_key  'C-h' # key-mapping for navigation.
# set -g @smart-splits_move_down_key  'C-j' #  --"--
# set -g @smart-splits_move_up_key    'C-k' #  --"--
# set -g @smart-splits_move_right_key 'C-l' #  --"--

set -g @smart-splits_resize_left_key  'M-h' # key-mapping for resizing.
set -g @smart-splits_resize_down_key  'M-j' #  --"--
set -g @smart-splits_resize_up_key    'M-k' #  --"--
set -g @smart-splits_resize_right_key 'M-l' #  --"--

set -g @smart-splits_resize_step_size '2' # change the step-size for resizing.

# === Copy-mode ===
# Allow for pane navigation (arrows + hjkl) in copy-mode
# bind-key -T copy-mode-vi Left  select-pane -L
# bind-key -T copy-mode-vi Down  select-pane -D
# bind-key -T copy-mode-vi Up    select-pane -U
# bind-key -T copy-mode-vi Right select-pane -R
# bind-key -T copy-mode-vi h     select-pane -L
# bind-key -T copy-mode-vi j     select-pane -D
# bind-key -T copy-mode-vi k     select-pane -U
# bind-key -T copy-mode-vi l     select-pane -R

# Re-override hjkl back to cursor movement after plugins clobber them
bind-key -T copy-mode-vi h send-keys -X cursor-left
bind-key -T copy-mode-vi j send-keys -X cursor-down
bind-key -T copy-mode-vi k send-keys -X cursor-up
bind-key -T copy-mode-vi l send-keys -X cursor-right

# Jump between shell prompts (Ctrl+P / Ctrl+N) and to the start of the last command's output (Ctrl+O),
# using the OSC 133 marks .zshrc prints
bind-key -T copy-mode-vi C-p send-keys -X previous-prompt
bind-key -T copy-mode-vi C-n send-keys -X next-prompt
bind-key -T copy-mode-vi C-o send-keys -X previous-prompt -o

# A count (98k) shows only its digits; tmux's default labels it "(repeat)"
bind-key -T copy-mode-vi 1 command-prompt -NP -I 1 -p '' { send-keys -N "%%" }
bind-key -T copy-mode-vi 2 command-prompt -NP -I 2 -p '' { send-keys -N "%%" }
bind-key -T copy-mode-vi 3 command-prompt -NP -I 3 -p '' { send-keys -N "%%" }
bind-key -T copy-mode-vi 4 command-prompt -NP -I 4 -p '' { send-keys -N "%%" }
bind-key -T copy-mode-vi 5 command-prompt -NP -I 5 -p '' { send-keys -N "%%" }
bind-key -T copy-mode-vi 6 command-prompt -NP -I 6 -p '' { send-keys -N "%%" }
bind-key -T copy-mode-vi 7 command-prompt -NP -I 7 -p '' { send-keys -N "%%" }
bind-key -T copy-mode-vi 8 command-prompt -NP -I 8 -p '' { send-keys -N "%%" }
bind-key -T copy-mode-vi 9 command-prompt -NP -I 9 -p '' { send-keys -N "%%" }

# Split panes
# bind-key C-x split-window -v
# bind-key C-v split-windw -h
unbind-key C-x # persists
bind-key h split-window -v
bind-key v split-window -h

# -r: repeat H/J/K/L within repeat-time (500 ms) without the prefix
bind-key -r H swap-pane -s '{left-of}'
bind-key -r J swap-pane -s '{down-of}'
bind-key -r K swap-pane -s '{up-of}'
bind-key -r L swap-pane -s '{right-of}'

# Equalize pane sizes at every level without rearranging them (tmux 3.8's select-layout -E skips split groups)
bind-key = run-shell "~/.config/tmux/equalize.py #{window_id}"

# Set base index to 1 (makes window numbers start at 1)
set -g base-index 1
setw -g pane-base-index 1

# -------------------------
# Windows and Sessions
# -------------------------
# Create new window
bind-key C-n new-window
# Close current window
unbind C-t
# Kill (Terminate) window
bind-key C-t kill-window
# Close (Break) current pane
bind-key C-b kill-pane
# Switch windows
bind-key -r C-q previous-window
bind-key -r C-e next-window
# Detach from session
bind-key C-x detach-client
# Number the panes (n instead of q; next-window is on C-e)
unbind-key q
bind-key n display-panes

set -g focus-events on

# Cmd+A in a Claude Code pane selects the whole prompt (claude-select-all.sh); in Neovim it's Alt+A, its
# select-all (keymaps.lua). kitty sends Cmd+A as this made-up sequence, which tmux knows as User0; other panes
# get nothing
set -s user-keys[0] "\e[9001~"
bind-key -n User0 if -F '#{==:#{pane_current_command},claude}' {
  run-shell -b 'sh ~/.config/tmux/claude-select-all.sh #{pane_id}'
} {
  if -F '#{@pane-is-vim}' { send-keys M-a }
}

# -------------------------
# Plugins
# -------------------------
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'smart-splits-nvim/backend-tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'   # save every 15 min, restore when the server starts
set -g @plugin 'alexwforsythe/tmux-which-key'  # prefix Space; menu in ~/.config/tmux/which-key.yaml
# set -g @plugin 'MunifTanjim/tmux-mode-indicator'

# -------------------------
# Plugin-settings
# -------------------------
set -g @continuum-restore 'on'
# prefix C-s/C-r are taken by choose-tree and rename-window
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
# reopen Claude Code with its conversation picker, and IPython (Homebrew's runs as a python process)
set -g @resurrect-processes '"~claude->claude --resume" "~bin/ipython->ipython"'
# mouse copies stay in copy mode at the same spot (q or Esc leaves)
set -g @yank_action 'copy-pipe'

# -------------------------
# Styling
# -------------------------
set -g status-style 'bg=terminal'

# Status left style
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_mantle},bold]  #S },#{?pane_in_mode,#{#[bg=#{@thm_sky},fg=#{@thm_mantle},bold]  #S },#{#[bg=#{@thm_mantle},fg=#{@thm_green}]  #S }}}"
# set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_mantle},bold]  #S },#{#[bg=#{@thm_mantle},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "

# set -g status-justify "left"

# Status right style
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#(gitmux -timeout 300ms -cfg ~/.gitmux.yml \"#{pane_current_path}\")"
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_yellow}]#(~/.local/bin/chezmoi-drift)"
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "

# Window style
set -wg automatic-rename on
set -g automatic-rename-format ''
set -g window-status-separator '|'
# a bell only marks its window (the bell icon below); kitty never gets it, so no sound
set -g bell-action none
set -g status-justify 'absolute-centre'
set -g @catppuccin_window_status_style 'custom'
set -g @catppuccin_window_flags ""
set -g @catppuccin_window_number ""
set -g @catppuccin_window_text "#[fg=#{@thm_rosewater},bg=#{@thm_mantle}] #I#{?#{!=:#{window_name},},: #W ,}#{?window_bell_flag,#[fg=#{@thm_yellow}]󰂞 ,}"
set -g @catppuccin_window_current_number ""
set -g @catppuccin_window_current_text "#[fg=#{@thm_mantle},bg=#{@thm_peach}] #I#{?#{!=:#{window_name},},: #W ,}"


# -------------------------
# TPM (Tmux Plugin Manager)
# -------------------------
# tmux-which-key reads config.yaml from its own folder (its XDG option needs GNU realpath), so link the
# chezmoi-tracked menu there before TPM loads it. The plugin's repo ignores config.yaml.
run-shell 'd=~/.tmux/plugins/tmux-which-key; [ -d "$d" ] && ln -sf ~/.config/tmux/which-key.yaml "$d/config.yaml"; true'

# TPM from Homebrew (Brewfile); plugins still install to ~/.tmux/plugins
run '/opt/homebrew/opt/tpm/share/tpm/tpm'

# -------------------------
# Useful Key Bindings
# -------------------------
# Reload config
unbind s
unbind C-s
bind-key s source-file ~/.tmux.conf \; display "Config reloaded!"
# Session picker
bind-key C-s choose-tree -Zs
bind-key r command-prompt -I "#W" "rename-window '%%'"
bind-key C-r command-prompt -I "#W" "rename-window '%%'"

bind-key -r C-a swap-window -t -1\; select-window -t -1
bind-key -r C-d swap-window -t +1\; select-window -t +1
