# General settings
# dummy line nr 2
set -g allow-passthrough on
setw -g mode-keys vi
set -g mouse on
set -g renumber-window on

# Set tmux prefix to Ctrl-w (instead of C-b)
set-option -g prefix C-w
unbind-key C-b          # unbind old prefix
bind-key C-w send-prefix

set -g update-environment "DISPLAY"
set -g default-terminal "xterm-kitty"
set -ga terminal-overrides ",xterm-kitty:RGB"
# Smart pane switching with awareness of Vim splits
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

# Use prefix + arrow keys to move between panes
bind-key Left  if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key Down  if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key Up    if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key Right if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Optional: also bind Vim-style hjkl with prefix
bind-key h if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key j if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key k if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key l if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Copy-mode pane navigation (arrows + hjkl)
bind-key -T copy-mode-vi Left  select-pane -L
bind-key -T copy-mode-vi Down  select-pane -D
bind-key -T copy-mode-vi Up    select-pane -U
bind-key -T copy-mode-vi Right select-pane -R
bind-key -T copy-mode-vi h     select-pane -L
bind-key -T copy-mode-vi j     select-pane -D
bind-key -T copy-mode-vi k     select-pane -U
bind-key -T copy-mode-vi l     select-pane -R

# Split panes
bind-key C-x split-window -v
bind-key C-v split-window -h

# Set base index to 1 (makes window numbers start at 1)
set -g base-index 1
setw -g pane-base-index 1

# -------------------------
# Windows and Sessions
# -------------------------
# Create new window
bind-key C-n new-window
# Close current window
unbind C-c
bind-key C-c kill-window
# Close current pane
bind-key C-b kill-pane
# Switch windows
bind-key C-q previous-window
bind-key C-e next-window

# Last-pane toggle (keep existing logic)
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"
bind-key -T copy-mode-vi 'C-\' select-pane -l

bind-key h split-window -h   # prefix + h
bind-key v split-window -v   # prefix + v
set -g focus-events on


# Requires gitmux installed
set -g status-right '#(gitmux "#{pane_current_path}")'


# -------------------------
# Plugins & plugin-settings
# -------------------------
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'alexwforsythe/tmux-which-key'  # prefix + space

# Styling
set -g status-style 'bg=terminal'

# Configure the catppuccin plugin
set -g @plugin 'catppuccin/tmux'


# status left style
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_mantle},bold]  #S },#{#[bg=#{@thm_mantle},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "

# set -g status-justify "left"

# status right style
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#(gitmux \"#{pane_current_path}\")"
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "

# window style
set -wg automatic-rename on
set -g automatic-rename-format ''
set -g window-status-separator '|'
set -g status-justify 'absolute-centre'
set -g @catppuccin_window_status_style 'custom'
set -g @catppuccin_window_flags ""
set -g @catppuccin_window_number ""
set -g @catppuccin_window_text "#[fg=#{@thm_rosewater},bg=#{@thm_mantle}] #I#{?#{!=:#{window_name},},: #W ,}"
set -g @catppuccin_window_current_number ""
set -g @catppuccin_window_current_text "#[fg=#{@thm_mantle},bg=#{@thm_peach}] #I#{?#{!=:#{window_name},},: #W ,}"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux


# -------------------------
# TPM (Tmux Plugin Manager)
# -------------------------
# Set TPM path if you plan to use plugins
set -g @tpm_path '~/.tmux/plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'

# -------------------------
# Useful Key Bindings
# -------------------------
# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"



