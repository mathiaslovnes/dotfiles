# -------------------------
# General Settings
# -------------------------
# Set prefix to Ctrl-a instead of default Ctrl-b
set -g prefix C-w
unbind C-b
bind C-w send-prefix


# Enable mouse support (click to select panes/windows)
set -g mouse on

# Faster scrolling
set -g history-limit 10000

# -------------------------
# Pane Navigation
# -------------------------
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Split panes
bind C-x split-window -h
bind C-v split-window -v

# Swap panes
bind < swap-pane -U
bind > swap-pane -D

# -------------------------
# Windows and Sessions
# -------------------------
# Create new window
bind C-c new-window
# Close current window
bind C-e kill-window
# Switch windows
bind -n C-a previous-window
bind -n C-d next-window

# Session management
# List sessions
bind s choose-tree -s
# List windows in current session
bind w choose-tree -w

# -------------------------
# Status Bar
# -------------------------
set -g default-terminal "tmux-256color"


# Requires gitmux installed
set -g status-right '#(gitmux "#{pane_current_path}")'

# -------------------------
# Clipboard Integration
# -------------------------
# macOS
if-shell "uname | grep -q Darwin" {
  bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
  bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
} {
  bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
  bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
}

# -------------------------
# Plugins & plugin-settings
# -------------------------
# Configure the catppuccin plugin
set -g @plugin 'catppuccin/tmux#v2.1.3' # See https://github.com/catppuccin/tmux/tags for additional tags
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style "rounded"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

# -------------------------
# TPM (Tmux Plugin Manager)
# -------------------------
# Set TPM path if you plan to use plugins
set -g @tpm_path '~/.tmux/plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'

# -------------------------
# Useful Key Bindings
# -------------------------
# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

