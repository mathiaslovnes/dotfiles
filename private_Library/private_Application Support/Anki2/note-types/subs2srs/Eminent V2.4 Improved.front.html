{{#sentence-card}}　
	<div id="sentence">
		<div style="margin-bottom: -35px;"></div>
		{{edit:sentence}}
<script>
(function () {
  var el = document.getElementById("sentence");
  var word = `{{text:word-as-written}}`.trim() || `{{text:word}}`.trim();
  if (!el || !word || el.querySelector("i")) return;
  for (var n = word.length; n >= 1; n--) {
    var t = word.slice(0, n);
    if (el.innerHTML.indexOf(t) !== -1) {
      el.innerHTML = el.innerHTML.split(t).join("<i>" + t + "</i>");
      return;
    }
  }
})();
</script>
	</div>
{{/sentence-card}}

<div style="margin-bottom: 25px;"></div>
  <div class="audio-buttons-no-picture">
    <div class="audio-divider-no-picture"></div>
    {{#word-audio}}<span class="audio-pill"><span class="audio wordAudio-no-picture audio-front"><span class="audio-lbl">語</span>{{word-audio}}</span></span>{{/word-audio}}
    <div class="audio-divider-no-picture"></div>
  </div>

<script>
(function () {
  var cls = document.documentElement.className + " " + document.body.className;
  var mobile = /\b(mobile|android|iphone|ipad)\b/.test(cls)
            || /Android|iPhone|iPad/.test(navigator.userAgent);
  if (mobile) return;
  var s = document.createElement("script");
  s.src = "_kanjiHover.js";
  document.body.appendChild(s);
})();
</script>



<script>
if (window._rHandler) { document.removeEventListener("keydown", window._rHandler); window._rHandler = null; }
window._cardKey = function (k) {
  if (k !== "r" && k !== "R") return false;
  var b = document.querySelector('.wordAudio-no-picture .replay-button');
  if (b) b.click();
  return !!b;
};
</script>



<!-- sentence-pitch: load the picture already on the front, so the back shows at once on phones -->
<div class="pic-preload" style="position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden">{{picture}}</div>
<script>
(function () {
  var im = document.querySelector(".pic-preload img");
  if (im && im.decode) im.decode().catch(function () {});
})();
</script>
