[mgr]
show_hidden = false # . toggles hidden files
sort_by = "natural" # 2.png before 10.png
linemode = "mtime" # last-modified time at the right of each row

# git.yazi: git status signs next to each file (setup in init.lua)
[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"
