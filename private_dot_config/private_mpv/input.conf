# Unbind F and G
F ignore
G ignore

space cycle pause

A seek -1 exact
a seek -5 exact
d no-osd sub-seek 0; 
s no-osd sub-seek -1
f no-osd sub-seek 1
g seek 5 exact
G seek 1 exact

m cycle fullscreen    # replaces mpv's default m = mute

# Searchable lists: l = every subtitle line (jump back to re-mine), H = watch history, W = episodes to resume
# (mpv's own g-l/g-h/g-w can't work: g seeks)
l script-binding select/select-subtitle-line
H script-binding select/select-watch-history
W script-binding select/select-watch-later

# Subtitle height: Cmd+K / Cmd+J move the Japanese subtitles (bottom) up / down,
# Cmd+Shift+K / Cmd+Shift+J the English ones (top)
Meta+k add sub-pos -1; show-text "JP subs: ${sub-pos}" 1500
Meta+j add sub-pos +1; show-text "JP subs: ${sub-pos}" 1500
Meta+K add secondary-sub-pos -1; show-text "ENG subs: ${secondary-sub-pos}" 1500
Meta+J add secondary-sub-pos +1; show-text "ENG subs: ${secondary-sub-pos}" 1500

# Subtitle size (both languages): Cmd+Option+K / Cmd+Option+J, Cmd+R resets it
# (mpv 0.42 gives the English line its own secondary-sub-scale)
Meta+Alt+k add sub-scale +0.1; add secondary-sub-scale +0.1
Meta+Alt+j add sub-scale -0.1; add secondary-sub-scale -0.1
Meta+r set sub-scale 1; set secondary-sub-scale 1    # reset subtitle size to default

# Subtitle delay: primary (JP) and secondary (ENG) are timed separately.
# show-text still displays with osd-level=0; the plain "add" message does not.
z add sub-delay -0.1; show-text "sub delay: ${sub-delay}" 1500
x add sub-delay +0.1; show-text "sub delay: ${sub-delay}" 1500
Z add secondary-sub-delay -0.1; show-text "secondary sub delay: ${secondary-sub-delay}" 1500
X add secondary-sub-delay +0.1; show-text "secondary sub delay: ${secondary-sub-delay}" 1500

# Subtitles on/off (scripts/sub_cycle.lua): j = Japanese (bottom), e = English (top)
j script-binding sub_cycle/japanese
e script-binding sub_cycle/english
J ignore
DOWN script-binding select/select-secondary-sid   # pick the secondary track from a list
Meta+BS script-binding sub_cycle/remove                    # remove an added subtitle file
Meta+Shift+BS script-binding sub_cycle/secondary-remove

ctrl+v nonrepeatable script-binding update-anki-card
ctrl+t script-binding toggle-clipboard-insertion
ctrl+d script-binding toggle-debug-mode

Meta+v nonrepeatable script-binding update-anki-card   # held key no longer re-runs it
Meta+t script-binding toggle-clipboard-insertion
Meta+d script-binding toggle-debug-mode

tab  script-binding uosc/toggle-ui

