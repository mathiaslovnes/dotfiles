save-position-on-quit=yes
# Lets other programs send mpv commands; Karabiner's Hyper+H (pause) and Hyper+Y (update Anki card) use it
input-ipc-server=/tmp/mpvsocket


# Spaces don't have to be escaped.
osd-playing-msg=File:${filename}

# SCREENSHOT
screenshot-png-compression=0
screenshot-high-bit-depth=yes  # Optional: Better quality
screenshot-template="%F_%P"


audio-file-auto=fuzzy  
audio-pitch-correction=yes  
# audio-samplerate=192000  (off: your files are 48 kHz and so is the DAC, so mpv was converting
#                           48 → 192 kHz and macOS back to 48 kHz: extra work, no gain)

# PERFORMANCE
# Decode video on the Mac's media engine instead of the CPU. x265 10-bit in software used up to
# ~10 cores in bursts for every frame (16 s of CPU per 50 s of video; 0.4 s with this), most
# likely what slowed app switching and made the audio crackle while playing.
hwdec=videotoolbox

# OSD
osd-level=0
osd-bar=no
osc=no

# Fullscreen: mpv's own fullscreen, not macOS's. Covers the whole screen and hides the menu bar
# and Dock while mpv is in front, without moving to a separate Space. m toggles it.
# (A plain window can't cover the menu bar's strip: macOS pushes it down below it.)
# Starts windowed: scripts/no_shadow.lua goes fullscreen once it has removed the window's shadow.
border=no
window-dragging=no
fullscreen=no
native-fs=no

# Fullscreen (experimental): a maximized window below the menu bar
# border=no
# window-maximized=yes
# window-dragging=no
# geometry=100%x100%+0+0
# macos-geometry-calculation=visible # visible/whole
# autofit-larger=100%x100%
# native-fs=yes

# Fullscreen (old)
# border=no
# window-maximized=yes
# window-dragging=no
# geometry=100%x100%+0+0
# macos-geometry-calculation=visible # visible/whole
# autofit-larger=100%x100%

# SUBS
sub-font-size=40
sub-font='Hiragino mincho pro w3' ##'BIZ UDPMincho'
sub-outline-size=0
## --sub-border-style=<outline-and-shadow|opaque-box|background-box>
sub-border-style=background-box
sub-color=1/1/1/1
sub-back-color=0/0/0/0.825
sub-delay=0

