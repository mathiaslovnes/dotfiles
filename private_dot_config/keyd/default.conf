# =============================================================================
#  keyd — macOS-style layout  ->  install as /etc/keyd/default.conf
#
#  Core idea (matched to your physical keys):
#     Alt   = Command  (drives the Cmd-shortcuts as Ctrl-combos)
#     Super = Option   (left for GNOME; word-nav lives on Super+Ctrl)
#     Ctrl  = Ctrl     (unchanged; still has the vim arrows)
#  Only the LEFT Alt becomes Command — right Alt stays AltGr so Norwegian
#  { } [ ] @ keep working.
#
#  Reload:  sudo keyd reload      Panic: hold  backspace + escape + enter
#  Reminder: keyd has NO inline comments — '#' only at the start of a line.
# =============================================================================

[ids]
*

[global]
# overload_tap_timeout = 200


# ---- Caps: hold = launcher layer, tap = Escape ----
[main]
capslock = overload(hyper, esc)
rightcontrol = layer(rightcontrol)


# =============================================================================
# COMMAND  =  the Alt key.  Cmd+<key> -> Ctrl+<key>.
# Shift passes through automatically, so Alt+Shift+Z -> Ctrl+Shift+Z (redo),
# Alt+Shift+T -> Ctrl+Shift+T (reopen tab), etc.
# Tab is deliberately NOT bound here, so Alt+Tab stays the app switcher.
# =============================================================================
[alt]
a = C-a
b = C-b
c = C-c
f = C-f
g = C-g
h = M-h
k = C-k
l = C-l
n = C-n
o = C-o
p = C-p
q = A-f4
r = C-r
s = C-s
t = C-t
v = C-S-v
w = C-w
x = C-x
z = C-z
# Zoom: Cmd+plus / Cmd+minus / Cmd+0
minus = C-minus
equal = C-equal
0 = C-0
# Tab switching: Cmd+1..9
1 = C-1
2 = C-2
3 = C-3
4 = C-4
5 = C-5
6 = C-6
7 = C-7
8 = C-8
9 = C-9
# Cmd+arrow = start/end of line, start/end of document (Mac behaviour)
left  = home
right = end
up    = C-home
down  = C-end
esc = S-tab


# =============================================================================
# OPTION-style text navigation.
# =============================================================================
[meta]
left  = C-left
right = C-right


[control]
h = left
j = down
k = up
l = right
tab = delete


[rightcontrol:C]
h = left
j = down
k = up
l = right
# Right-Ctrl + Esc -> suspend ; Right-Ctrl + Enter -> play/pause
escape = command(systemctl suspend)
enter = playpause


# ---- Shift ----
# Shift+Backspace -> delete previous word
[shift]
backspace = C-backspace
tab = backspace


# =============================================================================
# HYPER launchers (hold Caps). Needs /usr/local/bin/keyd-launch.
# Edit/remove to match what's installed on this laptop.
# =============================================================================
[hyper]
a = command(/usr/local/bin/keyd-launch anki)
b = command(/usr/local/bin/keyd-launch datagrip)
c = command(/usr/local/bin/keyd-launch brave-browser)
d = command(/usr/local/bin/keyd-launch discord)
f = command(/usr/local/bin/keyd-launch xdg-open https://jisho.org)
g = command(/usr/local/bin/keyd-launch gimp)
i = command(/usr/local/bin/keyd-launch lm-studio)
l = command(/usr/local/bin/keyd-launch rhythmbox)
m = command(/usr/local/bin/keyd-launch thunderbird)
n = command(/usr/local/bin/keyd-launch gnome-text-editor)
o = command(/usr/local/bin/keyd-launch obsidian)
p = command(/usr/local/bin/keyd-launch nordpass)
q = command(/usr/local/bin/keyd-launch --title Claude brave-browser --app=https://claude.ai)
r = command(/usr/local/bin/keyd-launch gnome-calculator)
s = command(/usr/local/bin/keyd-launch slack)
t = command(/usr/local/bin/keyd-launch kitty)
v = command(/usr/local/bin/keyd-launch mpv)
x = command(/usr/local/bin/keyd-launch nautilus)
z = command(/usr/local/bin/keyd-launch zotero)
. = command(/usr/local/bin/keyd-launch cold-turkey-blocker)
/ = command(/usr/local/bin/keyd-launch ticktick)
, = command(/usr/local/bin/keyd-launch gnome-control-center)
